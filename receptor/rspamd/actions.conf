# En el laboratorio desactivamos las acciones por puntaje antispam: así lo único que
# decide si un correo se marca o se rechaza es la política DMARC del dominio.
# Sin esto, A3 (SPF y DKIM fallidos) ya sumaba puntos de "greylist" en el escenario 2.
reject = null;
add_header = null;
rewrite_subject = null;
greylist = null;

# Marca visible de cuarentena: prefijo en el asunto (%s = asunto original).
subject = "[CUARENTENA] %s";
