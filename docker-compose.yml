# email-auth-lab — escenarios 0 a 5 (SPF, DKIM, DMARC, límites y extras)
# Todas las imágenes llevan versión fija para que el laboratorio sea reproducible.

name: email-auth-lab

services:
  # Genera las llaves DKIM que falten y renderiza las zonas DNS. Corre y termina.
  init:
    build: ./init
    image: email-auth-lab/init:lab
    network_mode: none
    volumes:
      - ./dns/plantillas:/plantillas:ro
      - llaves:/llaves
      - zonas-render:/zonas
      - estado:/estado
    restart: "no"

  dns:
    image: coredns/coredns:1.12.4
    command: ["-conf", "/etc/coredns/Corefile"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      # La carpeta, no el archivo: así CoreDNS ve los cambios del Corefile (plugin reload).
      - ./dns:/etc/coredns:ro
      - zonas-render:/zonas:ro
    networks:
      lab-net:
        ipv4_address: 172.28.0.53
    restart: unless-stopped

  emisor:
    build: ./emisor
    image: email-auth-lab/emisor:lab
    hostname: emisor.bancoseguro.test
    init: true
    dns: 172.28.0.53
    depends_on:
      init:
        condition: service_completed_successfully
      dns:
        condition: service_started
    volumes:
      # Solo la llave del banco (s2026), de solo lectura.
      - type: volume
        source: llaves
        target: /llaves
        read_only: true
        volume:
          subpath: bancoseguro.test
      # Lee el escenario activo y confirma en emisor.json que ya lo aplicó.
      - estado:/estado
    networks:
      lab-net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "postfix status && test -f /estado/emisor.json"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  receptor:
    build: ./receptor
    image: email-auth-lab/receptor:lab
    hostname: receptor.bancoseguro.test
    init: true
    dns: 172.28.0.53
    depends_on:
      - dns
      - mailpit
    networks:
      lab-net:
        ipv4_address: 172.28.0.25
    healthcheck:
      test: ["CMD-SHELL", "postfix status && rspamadm control stat >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.10
    hostname: mailpit
    dns: 172.28.0.53
    # Docker no publica puertos de contenedores que solo están en una red `internal`.
    # Por eso Mailpit también está en `ui-net` (bridge normal). Nadie más usa esa red.
    ports:
      # Siempre en 127.0.0.1. El puerto del host se puede cambiar en .env (MAILPIT_PUERTO).
      - "127.0.0.1:${MAILPIT_PUERTO:-8025}:8025"
    networks:
      lab-net:
        ipv4_address: 172.28.0.30
      ui-net: {}
    restart: unless-stopped

  # Lanza los ataques. Su API (puerto 8080) solo es accesible dentro de lab-net.
  atacante:
    build: ./atacante
    image: email-auth-lab/atacante:lab
    hostname: mail.atacante.test
    init: true
    dns: 172.28.0.53
    depends_on:
      init:
        condition: service_completed_successfully
      dns:
        condition: service_started
    volumes:
      # Solo las llaves del atacante. La del banco nunca se monta aquí.
      - type: volume
        source: llaves
        target: /llaves/atacante.test
        read_only: true
        volume:
          subpath: atacante.test
      - type: volume
        source: llaves
        target: /llaves/bancos3guro.test
        read_only: true
        volume:
          subpath: bancos3guro.test
    networks:
      lab-net:
        ipv4_address: 172.28.0.66
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Solo escenario 5: reenvío automático y lista de correo. Perfil `extras`:
  #   docker compose --profile extras up -d --build
  reenviador:
    build:
      context: ./reenviador
      additional_contexts:
        ataques: ./atacante/ataques
    image: email-auth-lab/reenviador:lab
    profiles: ["extras"]
    hostname: reenvio.asociacion-bancaria.test
    init: true
    dns: 172.28.0.53
    depends_on:
      - dns
    networks:
      lab-net:
        ipv4_address: 172.28.0.40
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # CLI `lab` y tests. `scale: 0`: `up --build` la construye pero no la arranca;
  # se usa con `./lab.sh <comando>` o `docker compose run --rm toolbox ...`.
  toolbox:
    build:
      context: ./toolbox
      additional_contexts:
        init: ./init
    image: email-auth-lab/toolbox:lab
    scale: 0
    dns: 172.28.0.53
    working_dir: /lab
    volumes:
      - ./tests:/lab/tests:ro
      - ./pyproject.toml:/lab/pyproject.toml:ro
      - ./reportes:/lab/reportes:ro
      - zonas-render:/zonas
      - estado:/estado
    networks:
      lab-net:
        ipv4_address: 172.28.0.100

volumes:
  llaves:        # llaves DKIM (privadas): nunca en el repositorio
  zonas-render:  # zonas DNS renderizadas por escenario y la zona activa
  estado:        # escenario activo (estado.json), compartido sin docker.sock

networks:
  lab-net:
    # Red aislada: ningún contenedor que envíe correo tiene salida a Internet.
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  ui-net: {}
