# Por defecto Rspamd guarda los SPF en caché al menos 5 minutos (min_cache_ttl = 5min),
# aunque el registro tenga TTL de 5 s. En el laboratorio cambiamos de escenario en vivo,
# así que respetamos el TTL de la zona: un cambio de SPF se nota en 5 s, no en 5 min.
min_cache_ttl = 1s;
spf_cache_expire = 5s;
