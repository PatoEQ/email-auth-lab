# Aplicación de la política DMARC publicada por el dominio del From:.
# Sintaxis según la documentación oficial (https://docs.rspamd.com/modules/dmarc/):
# cada disposición DMARC se traduce en una acción de Rspamd.
actions {
  # p=reject → rechazo SMTP 5xx: el correo nunca llega a la bandeja.
  reject = "reject";
  # p=quarantine → se entrega, pero con el asunto marcado (ver actions.conf).
  quarantine = "rewrite subject";
  # p=none no figura aquí: solo se observa y se informa.
}
