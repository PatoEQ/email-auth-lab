# email-auth-lab — Fase 1: esqueleto (dns, receptor, mailpit)
# Todas las imágenes llevan versión fija para que el laboratorio sea reproducible.

name: email-auth-lab

services:
  dns:
    image: coredns/coredns:1.12.4
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
      # Fase 1: la zona se sirve tal cual. Desde la fase 2, `init` la renderiza en zonas-render/.
      - ./dns/plantillas:/zonas:ro
    networks:
      lab-net:
        ipv4_address: 172.28.0.53
    restart: unless-stopped

  receptor:
    build: ./receptor
    image: email-auth-lab/receptor:fase1
    hostname: receptor.bancoseguro.test
    init: true
    dns: 172.28.0.53
    depends_on:
      - dns
      - mailpit
    networks:
      lab-net:
        ipv4_address: 172.28.0.25
    healthcheck:
      test: ["CMD-SHELL", "postfix status && rspamadm control stat >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.10
    hostname: mailpit
    dns: 172.28.0.53
    # Docker no publica puertos de contenedores que solo están en una red `internal`.
    # Por eso Mailpit también está en `ui-net` (bridge normal). Nadie más usa esa red.
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      lab-net:
        ipv4_address: 172.28.0.30
      ui-net: {}
    restart: unless-stopped

  # Herramientas para tests (en la fase 2 se convierte en la CLI `lab`).
  # Perfil propio: no arranca con `up`; se usa con `docker compose run --rm --build toolbox ...`.
  toolbox:
    build: ./toolbox
    image: email-auth-lab/toolbox:fase1
    profiles: ["herramientas"]
    dns: 172.28.0.53
    working_dir: /lab
    volumes:
      - ./tests:/lab/tests:ro
    networks:
      lab-net:
        ipv4_address: 172.28.0.100

networks:
  lab-net:
    # Red aislada: ningún contenedor que envíe correo tiene salida a Internet.
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  ui-net: {}
