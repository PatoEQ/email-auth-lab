# OpenDKIM del emisor: firma el correo de bancoseguro.test con el selector s2026.
# Postfix lo usa como milter solo cuando el escenario activo pide firmar (ver entrypoint.sh).

Mode                    s
Domain                  bancoseguro.test
Selector                s2026
KeyFile                 /etc/opendkim/llaves/s2026.private

# relaxed/relaxed: tolera cambios menores de espacios y mayúsculas en tránsito.
Canonicalization        relaxed/relaxed
SignatureAlgorithm      rsa-sha256
# Cabeceras que cubre la firma (h=). La lista por defecto de OpenDKIM no incluye
# Message-ID ni las de MIME; las agregamos para que no se puedan cambiar sin romperla.
SignHeaders             From,Reply-To,To,Cc,Subject,Date,Message-ID,In-Reply-To,References,MIME-Version,Content-Type,Content-Transfer-Encoding
# Firma el From: dos veces para que nadie pueda agregar otro From: sin romper la firma.
OversignHeaders         From

# Firma lo que llega desde estas IPs: localhost y la toolbox (`lab enviar legit`).
InternalHosts           127.0.0.1, 172.28.0.100

Socket                  inet:8891@127.0.0.1
UserID                  opendkim:opendkim
PidFile                 /run/opendkim/opendkim.pid
UMask                   007
Syslog                  no
