[project]
name = "lab"
version = "0.2.0"
description = "CLI del laboratorio email-auth-lab"
requires-python = ">=3.12"
dependencies = ["rich"]

[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab"]
